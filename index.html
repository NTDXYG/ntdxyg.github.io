<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guang Yang · 杨光</title>
  <meta name="description" content="Guang Yang, Postdoctoral Researcher at Zhejiang University. Program generation, security and comprehension for software and hardware.">
  <meta name="author" content="Guang Yang">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;

        var lang = localStorage.getItem('lang') || 'zh';
        document.documentElement.dataset.lang = lang;
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" id="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <p class="quip" id="quip" hidden></p>
      <nav class="content-nav" id="nav" aria-label="Sections"></nav>

      <div class="controls">
        <span class="lang-select">
          <select id="lang-toggle" aria-label="Language">
            <option value="en">EN</option>
            <option value="zh">中文</option>
          </select>
          <svg class="lang-caret" viewBox="0 0 10 6" aria-hidden="true">
            <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.3"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>

        <div class="theme-switch" id="theme-switch" role="group" aria-label="Theme">
          <span class="theme-switch-thumb" aria-hidden="true"></span>
          <button class="theme-option" type="button" data-theme-value="light" aria-pressed="false">
            <span data-lang-only="zh">浅色</span><span data-lang-only="en">Light</span>
          </button>
          <button class="theme-option" type="button" data-theme-value="dark" aria-pressed="false">
            <span data-lang-only="zh">深色</span><span data-lang-only="en">Dark</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout wrap">
    <aside class="sidebar" id="sidebar" aria-label="Profile"></aside>

    <main id="main" class="content">
      <div id="content-body"></div>
      <p class="load-error" id="load-error" hidden>
        无法加载 <code>data/site.json</code>。请通过本地服务器或 GitHub Pages 访问（浏览器会拦截 <code>file://</code> 下的数据请求）。
      </p>
    </main>
  </div>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p id="copyright"></p>
      <p id="updated"></p>
    </div>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
